name: Validacion PluriOne

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: empresa - copia
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          # Credencial exclusiva de la base efimera de CI, no de produccion.
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: pluri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pluri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci-test-only@127.0.0.1:5432/pluri_test
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Migraciones repetibles
        run: |
          python -m backend.app.persistencia_postgresql.migrar
          python -m backend.app.persistencia_postgresql.migrar
      - name: Pruebas API y PostgreSQL real
        run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: empresa - copia/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: empresa - copia/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /
